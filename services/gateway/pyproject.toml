[project]
name = "chatbot-gateway"
version = "1.0.0"
description = "Public API for the student frontend, auth, guard, pseudonymization, uploads and SSE"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chatbot-contracts",
  "chatbot-common",
  "chatbot-platform",
  "authlib>=1.3",
  "hvac>=2.3",
  "python-multipart>=0.0.12",
  "transformers>=4.46",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv.sources]
chatbot-contracts = { workspace = true }
chatbot-common = { workspace = true }
chatbot-platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
