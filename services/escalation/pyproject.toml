[project]
name = "chatbot-escalation"
version = "1.1.0"
description = "Level 3 escalation, tickets, on duty rota, expert notifications and answers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chatbot-contracts",
  "chatbot-common",
  "chatbot-platform",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv.sources]
chatbot-contracts = { workspace = true }
chatbot-common = { workspace = true }
chatbot-platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
