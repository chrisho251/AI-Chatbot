# Routes the public routes to the api service and nothing else. Internal routes stay private
# Add mkcert certificates under tls for trusted local https
http:
  routers:
    public:
      rule: PathPrefix(`/v1/ask`) || PathPrefix(`/v1/answers/`) || PathRegexp(`^/v1/tickets/[^/]+/answer$`)
      entryPoints: [web, websecure]
      service: api
  services:
    api:
      loadBalancer:
        servers:
          - url: http://api:8000
