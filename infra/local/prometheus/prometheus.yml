# Scrapes every service, the model servers, containers and GPUs every 15 seconds
# Targets of profiles that are not running simply show as down on the resources dashboard
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: services
    static_configs:
      - targets:
          - gateway:8000
          - orchestrator:8000
          - escalation:8000
          - w2-vision:8000
          - w3-code:8000
          - w4-math:8000
          - w5-clean:8000
          - w6-embed:8000
          - w7-deepsearch:8000
          - w8-gen:8000
  - job_name: llm
    static_configs:
      - targets: [llm:8080]
  - job_name: tei
    # TEI serves metrics on a separate port, check it when you pin the TEI image
    static_configs:
      - targets: [tei-embed:9000, tei-rerank:9000]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: dcgm
    static_configs:
      - targets: [dcgm-exporter:9400]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
