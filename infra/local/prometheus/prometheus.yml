# Scrapes the api service, the model servers, containers and GPUs every 15 seconds
# Targets of profiles that are not running simply show as down on the resources dashboard
# A worker moved to its own container is added to the services job with its compose name
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: services
    static_configs:
      - targets: [api:8000]
  - job_name: llm
    static_configs:
      - targets: [llm:8080]
  - job_name: tei
    # TEI serves metrics on a separate port, check it when you pin the TEI image
    static_configs:
      - targets: [tei-embed:9000, tei-rerank:9000]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: dcgm
    static_configs:
      - targets: [dcgm-exporter:9400]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
