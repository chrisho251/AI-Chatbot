[project]
name = "chatbot-common"
version = "1.1.0"
description = "Shared service helpers: FastAPI app factory, contract clients, model serving clients"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chatbot-contracts",
  "fastapi>=0.115",
  "httpx>=0.28",
  "prometheus-client>=0.21",
  "pydantic-settings>=2.6",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv.sources]
chatbot-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
