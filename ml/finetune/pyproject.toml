[project]
name = "chatbot-finetune"
version = "1.1.0"
description = "Fine tuning dataset build, SME approval gate, QLoRA training and model registry"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chatbot-contracts",
  "chatbot-platform",
  "bitsandbytes>=0.44; sys_platform != 'darwin'",
  "datasets>=3.0",
  "mlflow>=2.18",
  "peft>=0.13",
  "transformers>=4.46",
  "trl>=0.12",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv.sources]
chatbot-contracts = { workspace = true }
chatbot-platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
