[project]
name = "chatbot-w6-embed"
version = "1.0.0"
description = "W6 Worker embed, structure aware chunking and embeddings for content and queries"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chatbot-contracts",
  "chatbot-common",
  "chatbot-platform",
  "sentence-transformers>=3.3",
  "transformers>=4.46",
]

[project.scripts]
chatbot-w6-embed-job = "chatbot_w6_embed.job:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv.sources]
chatbot-contracts = { workspace = true }
chatbot-common = { workspace = true }
chatbot-platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
