[project]
name = "chatbot-w1-ingest"
version = "1.1.0"
description = "W1 Worker ingest, layout analysis and region split"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chatbot-contracts",
  "chatbot-common",
  "chatbot-platform",
  "docling>=2.15",
]

[project.scripts]
chatbot-w1-ingest-job = "chatbot_w1_ingest.job:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv.sources]
chatbot-contracts = { workspace = true }
chatbot-common = { workspace = true }
chatbot-platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
