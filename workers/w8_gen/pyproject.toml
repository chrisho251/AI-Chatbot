[project]
name = "chatbot-w8-gen"
version = "1.1.0"
description = "W8 Worker gen, grounded prompt, streamed cited answer and tool calls to W3 and W4"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chatbot-contracts",
  "chatbot-common",
  "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv.sources]
chatbot-contracts = { workspace = true }
chatbot-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
